name: AMD and retained Intel regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UICA_REQUIRE_SETUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install pinned decoder build dependency
        run: python -m pip install setuptools==80.9.0
      - name: Explicit pinned setup (no target code execution)
        run: python setup_zen.py --download
      - name: Explicit pinned local frontend setup (not redistributed)
        run: python setup_uica_web.py --download
      - name: AMD, GUI API and original Intel golden controls
        run: python -m unittest discover -s tests -v
      - name: Buster arithmetic examples (static evidence only)
        run: python examples/compare_buster.py
      - name: Source whitespace
        run: git diff --check
